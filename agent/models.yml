providers:
  cch_anthropic:
    baseUrl: http://localhost:23000/v1
    api: anthropic-messages
    apiKey: CCH_API_KEY # 会优先读这个环境变量；不存在时当字面量
    authHeader: true # 发送 Authorization: Bearer <key>
    disableStrictTools: true # 大多数 proxy 不支持 strict tool，建议打开
    models:
      - id: glm-5.2
        name: glm-5.2
        reasoning: true
        thinking:
          mode: budget
          efforts: [high, max]
          defaultLevel: max
        input: [text]
        contextWindow: 1000000
        maxTokens: 128000
        compat:
          requiresReasoningContentForToolCalls: true
      - id: k3
        name: k3
        reasoning: true
        thinking:
          mode: budget
          efforts: [low, high, max]
          defaultLevel: max
        input: [text, image]
        contextWindow: 1048576
        maxTokens: 1048576
        compat:
          requiresReasoningContentForToolCalls: true
      - id: k3-256k
        name: k3-256k
        reasoning: true
        thinking:
          mode: budget
          efforts: [low, high, max]
          defaultLevel: max
        input: [text, image]
        contextWindow: 262144
        maxTokens: 262144
        compat:
          requiresReasoningContentForToolCalls: true
      - id: MiniMax-M3
