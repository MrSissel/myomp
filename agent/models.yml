providers:
  cch_anthropic:
    baseUrl: http://localhost:23000/v1
    api: anthropic-messages
    apiKey: CCH_API_KEY # 会优先读这个环境变量；不存在时当字面量
    authHeader: true # 发送 Authorization: Bearer <key>
    disableStrictTools: true # 大多数 proxy 不支持 strict tool，建议打开
    models:
      - id: glm-5.2
        name: GLM 5.2 (cch)
        reasoning: true
        input: [text]
        contextWindow: 1000000
        maxTokens: 32768
      - id: k3
        name: Kimi K3 (cch)
        reasoning: true
        input: [text, image]
        # contextWindow: 256000
        contextWindow: 1000000
        maxTokens: 16384
      - id: deepseek-v4-flash
        name: DeepSeek V4 Flash (cch)
        input: [text]
        contextWindow: 128000
        maxTokens: 8192
      - id: MiniMax-M3
        name: MiniMax M3 (cch)
        input: [text, image]
        contextWindow: 256000
        maxTokens: 16384
